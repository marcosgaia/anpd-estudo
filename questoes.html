<script>
const Q=[{"id": 1, "m": "LGPD", "e": "Segundo a LGPD, dado pessoal sensível é aquele sobre:", "a": ["qualquer dado financeiro, como renda e patrimônio", "qualquer dado de criança ou adolescente", "dados de localização em tempo real do titular", "endereço residencial e número de telefone", "origem racial ou étnica, convicção religiosa, opinião política, saúde, vida sexual, dado genético ou biométrico, quando vinculado a pessoa natural"], "c": 4, "k": "Art. 5º, II, da Lei 13.709/2018. Dados financeiros, endereço e localização são dados pessoais, mas não constam do rol de sensíveis."}, {"id": 2, "m": "LGPD", "e": "Conforme a LGPD, o operador é:", "a": ["a pessoa natural ou jurídica, de direito público ou privado, que realiza o tratamento de dados pessoais em nome do controlador", "exclusivamente a pessoa jurídica de direito privado contratada por órgão público", "a pessoa indicada para atuar como canal de comunicação com a ANPD", "a pessoa natural a quem se referem os dados", "a pessoa a quem competem as decisões referentes ao tratamento"], "c": 0, "k": "Art. 5º, VII. Controlador decide (VI); encarregado é o canal de comunicação (VIII); titular é a pessoa natural (V)."}, {"id": 3, "m": "LGPD", "e": "A LGPD NÃO se aplica ao tratamento de dados pessoais realizado para fins exclusivamente:", "a": ["comerciais de comércio eletrônico", "de execução de políticas públicas", "jornalísticos e artísticos", "de proteção do crédito", "de pesquisa de mercado"], "c": 2, "k": "Art. 4º, II, 'a'. Fins acadêmicos também são excluídos (alínea 'b'), mas aplicando-se os arts. 7º e 11."}, {"id": 4, "m": "LGPD", "e": "Entre as alternativas, NÃO é fundamento da disciplina da proteção de dados pessoais (art. 2º da LGPD):", "a": ["o desenvolvimento econômico e tecnológico e a inovação", "a autodeterminação informativa", "a livre iniciativa, a livre concorrência e a defesa do consumidor", "a supremacia do interesse público sobre o privado", "a inviolabilidade da intimidade, da honra e da imagem"], "c": 3, "k": "Art. 2º, I a VII. A supremacia do interesse público é princípio do direito administrativo, não fundamento listado no art. 2º."}, {"id": 5, "m": "LGPD", "e": "O princípio que limita o tratamento ao mínimo necessário para a realização de suas finalidades, com dados pertinentes, proporcionais e não excessivos, é o da:", "a": ["finalidade", "adequação", "prevenção", "qualidade dos dados", "necessidade"], "c": 4, "k": "Art. 6º, III. Adequação (II) é compatibilidade com as finalidades informadas; finalidade (I) exige propósitos legítimos, específicos, explícitos e informados."}, {"id": 6, "m": "LGPD", "e": "O princípio da responsabilização e prestação de contas consiste em:", "a": ["demonstração, pelo agente, da adoção de medidas eficazes e capazes de comprovar o cumprimento das normas de proteção de dados, inclusive da eficácia dessas medidas", "garantia de exatidão, clareza e atualização dos dados", "adoção de medidas para prevenir a ocorrência de danos", "garantia de consulta facilitada e gratuita sobre a forma e a duração do tratamento", "impossibilidade de tratamento para fins discriminatórios ilícitos ou abusivos"], "c": 0, "k": "Art. 6º, X. As demais correspondem a livre acesso (IV), não discriminação (IX), prevenção (VIII) e qualidade dos dados (V)."}, {"id": 7, "m": "LGPD", "e": "Sobre o consentimento na LGPD, é correto afirmar:", "a": ["o ônus de provar a ausência de consentimento é do titular", "cabe ao controlador o ônus da prova de que o consentimento foi obtido em conformidade com a Lei", "autorizações genéricas são válidas se fornecidas por escrito", "fornecido por escrito, deve constar de cláusula comum, sem destaque, para não induzir o titular", "uma vez fornecido, só pode ser revogado com anuência do controlador"], "c": 1, "k": "Art. 8º, § 2º. Autorizações genéricas são nulas (§ 4º); revogação a qualquer tempo, gratuita e facilitada (§ 5º); cláusula destacada (§ 1º)."}, {"id": 8, "m": "LGPD", "e": "Qual das hipóteses abaixo é base legal prevista no art. 7º da LGPD, mas NÃO consta, como tal, do rol do art. 11 (dados sensíveis)?", "a": ["tutela da saúde, em procedimento realizado por profissionais de saúde", "cumprimento de obrigação legal ou regulatória pelo controlador", "exercício regular de direitos em processo judicial, administrativo ou arbitral", "proteção do crédito", "proteção da vida ou da incolumidade física do titular ou de terceiro"], "c": 3, "k": "Art. 7º, X (proteção do crédito) e IX (legítimo interesse) não aparecem no art. 11, II. As demais constam de ambos."}, {"id": 9, "m": "LGPD", "e": "Nos termos do art. 11, II, 'g', da LGPD, dados sensíveis podem ser tratados sem consentimento quando indispensáveis para:", "a": ["seleção de riscos por operadoras de planos de saúde", "atender aos interesses legítimos do controlador", "garantia da prevenção à fraude e à segurança do titular, nos processos de identificação e autenticação de cadastro em sistemas eletrônicos", "ações de marketing direcionado com opção de saída", "proteção do crédito"], "c": 2, "k": "Art. 11, II, 'g'. Seleção de riscos por planos de saúde é expressamente vedada (art. 11, § 5º)."}, {"id": 10, "m": "LGPD", "e": "O tratamento de dados pessoais de crianças, em regra, deverá ser realizado:", "a": ["independentemente de consentimento, por se tratar de dado público", "com consentimento da própria criança, se maior de 7 anos", "com o consentimento de ambos os pais, obrigatoriamente", "com autorização judicial", "com o consentimento específico e em destaque dado por pelo menos um dos pais ou pelo responsável legal"], "c": 4, "k": "Art. 14, § 1º. O § 3º admite coleta sem consentimento para contatar os pais (uma única vez, sem armazenamento) ou para proteção da criança."}, {"id": 11, "m": "LGPD", "e": "A pseudonimização, conforme a LGPD, é o tratamento por meio do qual o dado perde a possibilidade de associação a um indivíduo:", "a": ["desde que autorizada pela ANPD", "apenas quando o dado for sensível", "de forma definitiva e irreversível, por quaisquer meios", "senão pelo uso de informação adicional mantida separadamente pelo controlador em ambiente controlado e seguro", "mediante criptografia de ponta a ponta obrigatória"], "c": 3, "k": "Art. 13, § 4º. A anonimização (art. 5º, XI) busca a perda da associação; dado anonimizado não é dado pessoal, salvo reversão (art. 12)."}, {"id": 12, "m": "LGPD", "e": "A confirmação de existência ou o acesso a dados pessoais por meio de declaração clara e completa deve ser fornecida no prazo de até:", "a": ["48 horas", "5 dias úteis", "10 dias", "30 dias", "15 dias, contado da data do requerimento do titular"], "c": 4, "k": "Art. 19, II. Em formato simplificado, o atendimento é imediato (art. 19, I)."}, {"id": 13, "m": "LGPD", "e": "O titular tem direito a solicitar a revisão de decisões tomadas unicamente com base em tratamento automatizado. Segundo a redação vigente do art. 20 da LGPD:", "a": ["a lei não exige que a revisão seja feita por pessoa natural", "o direito depende de prévia autorização da ANPD", "a revisão deve ser obrigatoriamente realizada por pessoa natural", "o direito só se aplica a decisões de crédito", "o controlador pode recusar informações sobre critérios sem qualquer consequência"], "c": 0, "k": "Art. 20, caput, redação da Lei 13.853/2019; o § 3º, que previa revisão por pessoa natural, foi vetado. Recusa por segredo comercial permite auditoria da ANPD (§ 2º)."}, {"id": 14, "m": "LGPD", "e": "NÃO é direito do titular previsto no art. 18 da LGPD:", "a": ["confirmação da existência de tratamento", "informação sobre a possibilidade de não fornecer consentimento e as consequências da negativa", "portabilidade dos dados a outro fornecedor", "exigir indenização diretamente da ANPD por tratamento irregular de terceiro", "informação das entidades com as quais o controlador realizou uso compartilhado"], "c": 3, "k": "Art. 18, I, V, VII e VIII. A reparação de danos é devida pelo controlador ou operador (art. 42), não pela ANPD."}, {"id": 15, "m": "LGPD", "e": "Os dados pessoais serão eliminados após o término do tratamento, autorizada a conservação, entre outras finalidades, para:", "a": ["uso pelo controlador sem anonimização, por até 5 anos", "venda a terceiros mediante comunicação à ANPD", "qualquer finalidade comercial futura, se houver legítimo interesse", "uso exclusivo do controlador, vedado o acesso por terceiro, e desde que anonimizados os dados", "uso do operador para fins próprios"], "c": 3, "k": "Art. 16, IV. As demais hipóteses de conservação: obrigação legal (I), órgão de pesquisa (II) e transferência a terceiro respeitados os requisitos (III)."}, {"id": 16, "m": "LGPD", "e": "Quanto à comunicação de incidente de segurança, a LGPD estabelece que o controlador deverá comunicar:", "a": ["apenas ao titular, e somente se houver dado sensível", "à autoridade nacional e ao titular a ocorrência de incidente que possa acarretar risco ou dano relevante aos titulares", "apenas à autoridade nacional, em qualquer incidente", "à polícia judiciária, em até 24 horas", "somente ao encarregado, que decidirá sobre a publicidade"], "c": 1, "k": "Art. 48, caput. O § 1º remete o prazo à definição da autoridade nacional e lista o conteúdo mínimo da comunicação."}, {"id": 17, "m": "LGPD", "e": "A multa simples prevista na LGPD é de até:", "a": ["2% do faturamento, limitada a R$ 50 milhões por ano", "R$ 50 milhões por titular afetado", "2% do faturamento da pessoa jurídica de direito privado, grupo ou conglomerado no Brasil no último exercício, excluídos os tributos, limitada a R$ 50 milhões por infração", "4% do faturamento global, sem limite em reais", "10% do faturamento bruto, limitada a R$ 100 milhões"], "c": 2, "k": "Art. 52, II. O limite de R$ 50 milhões é por infração, não por ano."}, {"id": 18, "m": "LGPD", "e": "Quais sanções do art. 52 da LGPD podem ser aplicadas às entidades e aos órgãos públicos?", "a": ["advertência, publicização, bloqueio, eliminação, suspensão parcial do banco de dados, suspensão da atividade de tratamento e proibição parcial ou total", "todas, inclusive multa simples e diária", "nenhuma, pois órgão público não se sujeita à ANPD", "apenas advertência", "apenas advertência e multa simples"], "c": 0, "k": "Art. 52, § 3º: incisos I, IV, V, VI, X, XI e XII. Multas (II e III) não estão incluídas."}, {"id": 19, "m": "LGPD", "e": "Os agentes de tratamento não serão responsabilizados quando provarem, entre outras hipóteses:", "a": ["que o dano decorre de culpa exclusiva do titular dos dados ou de terceiro", "que o dano foi apenas moral", "que adotaram programa de governança, ainda que tenha havido violação à lei", "que o operador agiu contra as instruções do controlador, no caso do controlador diretamente envolvido", "que o titular não comunicou o dano em 30 dias"], "c": 0, "k": "Art. 43, I a III. Programa de governança é critério de dosimetria (art. 52, § 1º, IX), não excludente."}, {"id": 20, "m": "LGPD", "e": "Em matéria de transferência internacional de dados, NÃO é hipótese autorizada pelo art. 33 da LGPD:", "a": ["consentimento específico e em destaque, com informação prévia sobre o caráter internacional", "decisão unilateral do operador, independentemente de garantias", "autorização da autoridade nacional", "cláusulas-padrão contratuais", "países com grau de proteção adequado"], "c": 1, "k": "Art. 33, I, II 'b', V e VIII. Não há hipótese de transferência por mera decisão do operador."}, {"id": 21, "m": "LGPD", "e": "Segundo a LGPD, o encarregado deve:", "a": ["manter sua identidade sob sigilo para evitar pressões", "ser aprovado previamente pela ANPD", "ser registrado na OAB", "ser obrigatoriamente servidor efetivo do controlador", "ter identidade e informações de contato divulgadas publicamente, de forma clara e objetiva, preferencialmente no sítio eletrônico do controlador"], "c": 4, "k": "Art. 41, § 1º. Atividades no § 2º; a ANPD pode prever dispensa de indicação conforme porte (§ 3º)."}, {"id": 22, "m": "ANPD e Regulação", "e": "Com a redação dada pela Lei 15.352/2026, a ANPD é:", "a": ["autarquia comum vinculada à Casa Civil", "Agência Nacional de Proteção de Dados, autarquia de natureza especial vinculada ao Ministério da Justiça e Segurança Pública, com sede e foro no Distrito Federal", "órgão da Presidência da República sem personalidade jurídica", "empresa pública vinculada ao Ministério da Gestão", "agência executiva vinculada ao Ministério da Fazenda"], "c": 1, "k": "LGPD, art. 55-A, redação da Lei 15.352/2026, que também incluiu a ANPD no rol do art. 2º da Lei 13.848/2019 (inciso XII)."}, {"id": 23, "m": "ANPD e Regulação", "e": "Conforme o art. 55-C da LGPD (redação atual), integram a ANPD, entre outros:", "a": ["Conselho Diretor, Conselho Nacional de Proteção de Dados Pessoais e da Privacidade, Corregedoria, Ouvidoria, Procuradoria e Auditoria", "apenas Conselho Diretor e unidades administrativas", "Conselho Diretor, Tribunal Administrativo e Defensoria", "Conselho Diretor e Ministério Público de Dados", "Diretoria Colegiada, CADE e Ouvidoria"], "c": 0, "k": "Art. 55-C, I a VI; Procuradoria (V-A) e Auditoria (V-B) com redação/inclusão pela Lei 15.352/2026."}, {"id": 24, "m": "ANPD e Regulação", "e": "O Conselho Diretor da ANPD é composto de:", "a": ["4 diretores e 1 ouvidor", "7 diretores, além do Diretor-Presidente", "3 diretores", "5 diretores, incluído o Diretor-Presidente", "23 representantes"], "c": 3, "k": "LGPD, art. 55-D, caput. O CNPD tem 23 representantes (art. 58-A). Atenção: o § 3º do art. 55-D prevê mandato de 4 anos, enquanto a Lei 9.986 (alterada pela 13.848) fixa 5 anos para agências — tema em transição; confira a redação vigente."}, {"id": 25, "m": "ANPD e Regulação", "e": "Segundo a LGPD, a aplicação das sanções nela previstas compete:", "a": ["ao CNPD", "ao Poder Judiciário", "concorrentemente à ANPD e aos Procons", "exclusivamente à ANPD", "à ANPD e ao Ministério Público, alternativamente"], "c": 3, "k": "Art. 55-K. A competência sancionatória da LGPD é exclusiva da ANPD, que articula sua atuação com outros órgãos (parágrafo único)."}, {"id": 26, "m": "ANPD e Regulação", "e": "Segundo a Lei 13.848/2019, a natureza especial conferida à agência reguladora é caracterizada:", "a": ["pela ausência de tutela ou de subordinação hierárquica, pela autonomia funcional, decisória, administrativa e financeira e pela investidura a termo de seus dirigentes e estabilidade durante os mandatos", "pela possibilidade de exoneração ad nutum dos dirigentes", "pela isenção de controle externo do TCU", "pela subordinação hierárquica ao ministério supervisor", "pela personalidade jurídica de direito privado"], "c": 0, "k": "Lei 13.848/2019, art. 3º, caput. O controle externo é do Congresso com auxílio do TCU (art. 14)."}, {"id": 27, "m": "ANPD e Regulação", "e": "Pela Lei 13.848/2019, o período de consulta pública sobre minutas de atos normativos terá duração mínima de:", "a": ["15 dias úteis", "60 dias", "10 dias úteis", "30 dias", "45 dias, ressalvado caso excepcional de urgência e relevância, devidamente motivado"], "c": 4, "k": "Art. 9º, § 2º."}, {"id": 28, "m": "ANPD e Regulação", "e": "A pauta de reunião deliberativa do conselho diretor ou da diretoria colegiada deve ser divulgada no sítio da agência com antecedência mínima de:", "a": ["15 dias úteis", "10 dias corridos", "5 dias úteis", "24 horas", "3 dias úteis"], "c": 4, "k": "Lei 13.848/2019, art. 8º, § 1º. A gravação deve ser disponibilizada em até 15 dias úteis (§ 3º) e a ata em até 5 dias úteis após aprovação (§ 4º)."}, {"id": 29, "m": "ANPD e Regulação", "e": "Sobre o ouvidor das agências reguladoras, a Lei 13.848/2019 dispõe que:", "a": ["pode acumular a função com a de diretor", "é nomeado pelo Diretor-Presidente da agência", "terá mandato de 3 anos, vedada a recondução, e atuará sem subordinação hierárquica", "seus relatórios têm caráter impositivo para o conselho diretor", "terá mandato de 5 anos, permitida uma recondução"], "c": 2, "k": "Arts. 22, caput e § 5º, e 23, § 1º."}, {"id": 30, "m": "ANPD e Regulação", "e": "A Análise de Impacto Regulatório (AIR), segundo a Lei 13.848/2019:", "a": ["é facultativa em qualquer caso", "substitui a consulta pública", "só é exigida para atos sobre tarifas", "é elaborada pelo TCU", "deve preceder, nos termos de regulamento, a adoção e as propostas de alteração de atos normativos de interesse geral; quando não realizada, deve ser disponibilizada ao menos nota técnica ou documento equivalente"], "c": 4, "k": "Art. 6º, caput e § 5º."}, {"id": 31, "m": "ANPD e Regulação", "e": "Quanto à descentralização de atividades das agências reguladoras federais para entes subnacionais (Lei 13.848/2019, art. 34):", "a": ["dispensa acordo de cooperação", "a agência delegante deixa de ser instância recursal", "é vedada a delegação de competências normativas", "é permitida a delegação de competências normativas mediante convênio", "abrange obrigatoriamente atividades do SUS"], "c": 2, "k": "Art. 34, § 1º; a delegante permanece instância superior e recursal (§ 7º); SUS é exceção (caput)."}, {"id": 32, "m": "Direito Constitucional", "e": "A proteção dos dados pessoais, inclusive nos meios digitais, foi expressamente incluída na Constituição como direito fundamental pela:", "a": ["Emenda Constitucional nº 19/1998, no art. 37", "Lei 13.709/2018, no art. 1º", "Emenda Constitucional nº 45/2004, no art. 5º, LXXVIII", "Emenda Constitucional nº 115/2022, no art. 5º, LXXIX", "própria redação originária de 1988, no art. 5º, X"], "c": 3, "k": "CF, art. 5º, LXXIX, incluído pela EC 115/2022, que também inseriu os arts. 21, XXVI, e 22, XXX."}, {"id": 33, "m": "Direito Constitucional", "e": "Compete privativamente à União legislar sobre proteção e tratamento de dados pessoais, conforme:", "a": ["art. 25, § 1º, da CF", "art. 30, I, da CF", "art. 22, XXX, da CF", "art. 24, I, da CF (competência concorrente)", "art. 23, I, da CF (competência comum)"], "c": 2, "k": "CF, art. 22, XXX (EC 115/2022). Organizar e fiscalizar a proteção de dados, nos termos da lei, compete à União (art. 21, XXVI)."}, {"id": 34, "m": "Direito Constitucional", "e": "O remédio constitucional para assegurar o conhecimento de informações relativas à pessoa do impetrante constantes de registros de entidades governamentais ou de caráter público é o:", "a": ["mandado de injunção", "habeas data", "habeas corpus", "ação popular", "mandado de segurança coletivo"], "c": 1, "k": "CF, art. 5º, LXXII, 'a'. Regulamentado pela Lei 9.507/1997."}, {"id": 35, "m": "Direito Constitucional", "e": "A aprovação prévia, pelo Senado Federal, da escolha de titulares de cargos que a lei determinar (como dirigentes de agências reguladoras) está prevista no:", "a": ["art. 84, XXV, da CF", "art. 52, III, 'f', da CF", "art. 48, X, da CF", "art. 49, I, da CF", "art. 51, IV, da CF"], "c": 1, "k": "CF, art. 52, III, 'f', citado expressamente nos arts. 55-D, § 1º, da LGPD e 23 da Lei 13.848/2019."}, {"id": 36, "m": "Direito Constitucional", "e": "Segundo o art. 37, XIX, da CF, autarquia somente poderá ser:", "a": ["criada por resolução do Senado", "criada por decreto do Presidente da República", "criada por lei específica", "autorizada por lei específica, com registro em cartório", "criada por lei complementar"], "c": 2, "k": "CF, art. 37, XIX: lei específica cria autarquia e autoriza a instituição de empresa pública, sociedade de economia mista e fundação."}, {"id": 37, "m": "Direito Constitucional", "e": "As pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros:", "a": ["objetivamente, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa", "solidariamente com o agente, sem direito de regresso", "apenas se o agente for servidor efetivo", "somente após condenação penal do agente", "subjetivamente, mediante prova de culpa do serviço"], "c": 0, "k": "CF, art. 37, § 6º."}, {"id": 38, "m": "Direito Constitucional", "e": "São
